map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name bunnybox.local;

    access_by_lua_file /usr/share/ssowat/access.lua;

    include /etc/nginx/conf.d/acme-challenge.conf.inc;

    location ^~ '/.well-known/ynh-diagnosis/' {
        alias /var/www/.well-known/ynh-diagnosis/;
    }

    location ^~ '/.well-known/autoconfig/mail/' {
        alias /var/www/.well-known/bunnybox.local/autoconfig/mail/;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    include /etc/nginx/conf.d/yunohost_http_errors.conf.inc;

    access_log /var/log/nginx/bunnybox.local-access.log;
    error_log /var/log/nginx/bunnybox.local-error.log;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bunnybox.local;

    include /etc/nginx/conf.d/security.conf.inc;

    ssl_certificate /etc/yunohost/certs/bunnybox.local/crt.pem;
    ssl_certificate_key /etc/yunohost/certs/bunnybox.local/key.pem;

    location ^~ '/.well-known/autoconfig/mail/' {
        alias /var/www/.well-known/bunnybox.local/autoconfig/mail/;
    }

    access_by_lua_file /usr/share/ssowat/access.lua;

    include /etc/nginx/conf.d/bunnybox.local.d/*.conf;

    include /etc/nginx/conf.d/yunohost_sso.conf.inc;
    include /etc/nginx/conf.d/yunohost_admin.conf.inc;
    include /etc/nginx/conf.d/yunohost_api.conf.inc;
    include /etc/nginx/conf.d/yunohost_http_errors.conf.inc;

    access_log /var/log/nginx/bunnybox.local-access.log;
    error_log /var/log/nginx/bunnybox.local-error.log;
}